---
# Hyperledger Caliper benchmark for the anti-doping governance framework.
#
# Three groups of rounds:
#
#   A. Saturation sweep — one write transaction at rising offered load, which
#      locates the saturation point and produces the throughput-versus-load
#      curve that replaces the manuscript's projected Figure 6.
#
#   B. Endorsement cost — the same transaction endorsed by one organizational
#      class and then by two, isolating the price of the cross-organizational
#      endorsement requirement that §4.1 relies on against insider collusion.
#
#   C. Per-function rounds — one round per smart contract function named in
#      Tables 1 and 3, each endorsed by exactly the organizations its policy
#      requires, so cost is attributable to individual regulatory operations.
#
# Interpretation reference: ~27 TPS. WADA analysed approximately 330,000
# samples globally in 2022; at roughly 30 custody transactions per sample,
# concentrated into peak testing periods, that is the operational demand line
# used in §5.1 of the manuscript.

test:
  name: antidoping-governance-framework
  description: >
    Measured throughput and latency for the WADA Code chain-of-custody and GDPR
    consent chaincodes on a five-organization Hyperledger Fabric 2.5 network
    with CouchDB state databases and Raft ordering.
  workers:
    type: local
    number: 2
  rounds:
    # ---------------------------------------------------------------- A. sweep
    - label: sweep-10tps
      description: Article 5.3 custody initiation at 10 TPS offered load.
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts: { tps: 10 }
      workload:
        module: benchmark/workloads/initiate-sample-custody.js

    - label: sweep-25tps
      description: Article 5.3 custody initiation at 25 TPS offered load.
      txNumber: 375
      rateControl:
        type: fixed-rate
        opts: { tps: 25 }
      workload:
        module: benchmark/workloads/initiate-sample-custody.js

    - label: sweep-50tps
      description: Article 5.3 custody initiation at 50 TPS offered load.
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts: { tps: 50 }
      workload:
        module: benchmark/workloads/initiate-sample-custody.js

    - label: sweep-100tps
      description: Article 5.3 custody initiation at 100 TPS offered load.
      txNumber: 600
      rateControl:
        type: fixed-rate
        opts: { tps: 100 }
      workload:
        module: benchmark/workloads/initiate-sample-custody.js

    - label: sweep-saturated
      description: >
        Article 5.3 custody initiation at 60 TPS offered load — well above the
        measured ceiling, so the round reports the network's saturated write
        throughput rather than the driver's pace.
      txNumber: 600
      rateControl:
        type: fixed-rate
        opts: { tps: 60 }
      workload:
        module: benchmark/workloads/initiate-sample-custody.js

    # --------------------------------------------------- B. endorsement cost
    - label: endorse-1org-initiateSampleCustody
      description: Custody initiation endorsed by one organizational class (NADO).
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts: { tps: 60 }
      workload:
        module: benchmark/workloads/initiate-sample-custody.js

    - label: endorse-2org-initiateSampleCustody
      description: >
        The identical transaction endorsed by two organizational classes
        (NADO and Laboratory) — the §4.1 collusion mitigation.
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts: { tps: 60 }
      workload:
        module: benchmark/workloads/initiate-dual-endorsed.js

    # ------------------------------------------------------- C. per function
    - label: recordCustodyTransfer
      description: >
        Article 5.4 custody transfer, endorsed by both parties and bound to a
        two-organization state-based endorsement policy.
      txNumber: 400
      rateControl:
        type: fixed-rate
        opts: { tps: 60 }
      workload:
        module: benchmark/workloads/record-custody-transfer.js
        arguments: { poolSize: 200 }

    - label: recordSampleAnalysisResult
      description: >
        Article 2.1 analysis commitment, including Prohibited List hash
        verification against the on-ledger copy.
      txNumber: 400
      rateControl:
        type: fixed-rate
        opts: { tps: 60 }
      workload:
        module: benchmark/workloads/record-analysis-result.js
        arguments: { poolSize: 200 }

    - label: triggerResultsManagement
      description: >
        Article 7.1 results management — the Table 2 decision engine executing
        over committed ledger state. The heaviest transaction in the framework.
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts: { tps: 60 }
      workload:
        module: benchmark/workloads/trigger-results-management.js
        arguments: { poolSize: 150 }

    - label: validateConsent
      description: >
        GDPR Article 7 ABAC gate across all six biological data categories,
        writing an access-audit record for every decision.
      txNumber: 400
      rateControl:
        type: fixed-rate
        opts: { tps: 60 }
      workload:
        module: benchmark/workloads/validate-consent.js

    # Read-only rounds: no ordering, no commit, single-peer evaluation.
    - label: evaluateDecisionTable
      description: >
        The Table 2 decision engine alone, read-only. Isolates the cost of the
        regulatory logic from state I/O and consensus.
      txNumber: 2000
      rateControl:
        type: fixed-rate
        opts: { tps: 500 }
      workload:
        module: benchmark/workloads/evaluate-decision-table.js

    - label: previewConsentDecision
      description: Read-only six-category ABAC evaluation.
      txNumber: 1500
      rateControl:
        type: fixed-rate
        opts: { tps: 500 }
      workload:
        module: benchmark/workloads/preview-consent-decision.js

    - label: getCustodyChain
      description: Read-only custody-chain range query (provenance view).
      txNumber: 1500
      rateControl:
        type: fixed-rate
        opts: { tps: 500 }
      workload:
        module: benchmark/workloads/get-custody-chain.js
        arguments: { poolSize: 200 }

monitors:
  resource:
    - module: docker
      options:
        interval: 10
        containers:
          - peer0.nado.antidoping.org
          - peer0.lab.antidoping.org
          - orderer.antidoping.org
          - couchdb0-nado
          - custody-cc
          - consent-cc
