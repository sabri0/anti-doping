---
# Does write throughput depend on how much state the ledger already holds?
#
# Running the full suite three times in sequence produced a fourfold difference
# in custody-write throughput between the first pass and the second, while read
# paths and writes that do not accumulate sample records were unchanged. The
# obvious explanation was the size of the state database being written into.
#
# This configuration tests that explanation rather than assuming it. Twelve
# identical rounds - same workload, same transaction count, same configured send
# rate - run back to back on a freshly created network, so the only quantity
# differing systematically between them is the number of records already
# committed. Round n measures throughput after roughly 600(n-1) samples.
#
# The answer, on this deployment, is no: throughput across the twelve rounds is
# uncorrelated with round index, and the last three rounds match the first three.
# What the sequence does establish is the size of the between-round variation on
# a single shared host - which is what makes any single-round figure, including
# the one reported in the previous version of this work, uninterpretable on its
# own. See scripts/analyse-controls.py.
#
# Must be run against a NETWORK BROUGHT UP CLEAN, or round 1 does not sit at
# zero accumulated state and the experiment tests nothing.
#
# Run:  CONFIG=benchmark/state-scaling.yaml REPORT=benchmark/state-scaling.html
#       LOG=benchmark/state-scaling.log ./scripts/run-benchmark.sh

test:
  name: state-scaling
  description: >
    Twelve identical Article 5.3 custody-initiation rounds on a freshly created
    network, measuring committed throughput against the volume of state already
    written.
  workers:
    type: local
    number: 2
  rounds:
    - label: state-01
      description: Article 5.3 custody initiation at 60 TPS configured, round 1 of 12.
      txNumber: 600
      rateControl:
        type: fixed-rate
        opts: { tps: 60 }
      workload:
        module: benchmark/workloads/initiate-sample-custody.js
    - label: state-02
      description: Article 5.3 custody initiation at 60 TPS configured, round 2 of 12.
