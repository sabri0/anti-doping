---
# One long saturating write round, for resource attribution only.
#
# Long enough that a `docker stats` sweep over every container completes many
# times inside it: an earlier version ran 900 transactions and the sampler
# captured a single sweep, taken before the load had started, which attributed
# nothing.
test:
  name: resource-sample
  workers: { type: local, number: 2 }
  rounds:
    - label: resource-sample-write
      description: Article 5.3 custody initiation at 60 TPS configured, sampled throughout.
      txNumber: 3000
      rateControl: { type: fixed-rate, opts: { tps: 60 } }
      workload: { module: benchmark/workloads/initiate-sample-custody.js }
