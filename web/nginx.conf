server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin proxy to the REST gateway, so the platform page can call the
  # ledger without cross-origin configuration.
  location /api/ {
    proxy_pass http://gateway:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
}
