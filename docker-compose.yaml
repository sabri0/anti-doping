  # ---------------------------------------------------------- IPFS (Kubo) off-chain store
  # Three nodes so that erasure must unpin across a cluster, not a single host (§6).

  ipfs0:
    image: ipfs/kubo:v0.29.0
    container_name: ipfs0
    labels: { antidoping.role: "ipfs" }
    environment:
      - IPFS_PROFILE=server
    ports:
      - "5011:5001"
      - "8091:8080"
    volumes:
      - ipfs0-data:/data/ipfs
      - ./network/ipfs/init:/container-init.d:ro
    networks: [antidoping_net]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 20

  ipfs1:
    image: ipfs/kubo:v0.29.0
    container_name: ipfs1
    labels: { antidoping.role: "ipfs" }
    environment:
      - IPFS_PROFILE=server
    ports:
      - "5012:5001"
      - "8092:8080"
    volumes:
      - ipfs1-data:/data/ipfs
      - ./network/ipfs/init:/container-init.d:ro
    networks: [antidoping_net]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 20

  ipfs2:
    image: ipfs/kubo:v0.29.0
    container_name: ipfs2
    labels: { antidoping.role: "ipfs" }
    environment:
      - IPFS_PROFILE=server
    ports:
      - "5013:5001"
      - "8093:8080"
    volumes:
      - ipfs2-data:/data/ipfs
      - ./network/ipfs/init:/container-init.d:ro
    networks: [antidoping_net]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------- Tooling containers
  # All administration runs inside containers so the host needs nothing but Docker.
  cli:
    image: hyperledger/fabric-tools:2.5.13
    container_name: cli
    tty: true
    stdin_open: true
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_PEER_TLS_ENABLED=true
    working_dir: /work
    command: sleep infinity
    volumes:
      - .:/work
    networks: [antidoping_net]

  ca-tools:
    image: hyperledger/fabric-ca:1.5.15
    container_name: ca-tools
    tty: true
    stdin_open: true
    working_dir: /work
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    volumes:
      - .:/work
    networks: [antidoping_net]

  # ---------------------------------------------------------- Chaincode as a service
  # CHAINCODE_ID values are written into .env by scripts/deploy-chaincode.sh
  # after `peer lifecycle chaincode install` reports the package identifier.
  custody-cc:
    build: ./chaincode/custody
    image: antidoping/custody-cc:1.0
    container_name: custody-cc
    labels: { antidoping.role: "chaincode" }
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=${CUSTODY_CCID}
      - CORE_CHAINCODE_ID_NAME=${CUSTODY_CCID}
    networks: [antidoping_net]

  consent-cc:
    build: ./chaincode/consent
    image: antidoping/consent-cc:1.0
    container_name: consent-cc
    labels: { antidoping.role: "chaincode" }
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=${CONSENT_CCID}
      - CORE_CHAINCODE_ID_NAME=${CONSENT_CCID}
    networks: [antidoping_net]

  # ---------------------------------------------------------- Application tier
  gateway:
    build: ./gateway
    image: antidoping/gateway:1.0
    container_name: gateway
    labels: { antidoping.role: "gateway" }
    environment:
      - PORT=3000
      - CHANNEL=antidopingchannel
      - CRYPTO_ROOT=/work/network/organizations
    ports:
      - "3000:3000"
    volumes:
      - ./network/organizations:/work/network/organizations:ro
    networks: [antidoping_net]

  web:
    build: ./web
    image: antidoping/web:1.0
    container_name: web
    labels: { antidoping.role: "web" }
    ports:
      - "8088:80"
    networks: [antidoping_net]
