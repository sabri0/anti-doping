    container_name: ca-athlete
    cpuset: "0-5"
    labels: { antidoping.role: "ca", antidoping.org: "athlete" }
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-athlete
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
      - FABRIC_CA_SERVER_CSR_CN=ca-athlete
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-athlete,localhost,127.0.0.1
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./network/organizations/fabric-ca/athlete:/etc/hyperledger/fabric-ca-server
    networks: [antidoping_v2]

  ca-federation:
