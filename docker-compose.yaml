  # ---------------------------------------------------------- IPFS (Kubo) off-chain store
  # Private cluster: no bootstrap peers, local-only routing (network/ipfs/init).

  ipfs0:
    image: ipfs/kubo:v0.29.0
    container_name: ipfs0
    cpuset: "0-5"
    labels: { antidoping.role: "ipfs" }
    environment:
      - IPFS_PROFILE=server
    ports:
      - "5011:5001"
    volumes:
      - ipfs0-data:/data/ipfs
      - ./network/ipfs/init:/container-init.d:ro
    networks: [antidoping_v2]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 20

  ipfs1:
    image: ipfs/kubo:v0.29.0
    container_name: ipfs1
    cpuset: "0-5"
    labels: { antidoping.role: "ipfs" }
    environment:
      - IPFS_PROFILE=server
    ports:
      - "5012:5001"
    volumes:
      - ipfs1-data:/data/ipfs
      - ./network/ipfs/init:/container-init.d:ro
    networks: [antidoping_v2]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 20

  ipfs2:
    image: ipfs/kubo:v0.29.0
    container_name: ipfs2
    cpuset: "0-5"
    labels: { antidoping.role: "ipfs" }
    environment:
      - IPFS_PROFILE=server
    ports:
      - "5013:5001"
    volumes:
      - ipfs2-data:/data/ipfs
      - ./network/ipfs/init:/container-init.d:ro
    networks: [antidoping_v2]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------- Tooling containers
  # The cli image is fabric-tools 2.5 with the Fabric 3.1.5 binaries layered on top
  # (network/tools/Dockerfile): no 3.x tools image is published.
  cli:
    build: ./network/tools
    image: antidoping/fabric-tools:3.1.5
    container_name: cli
    tty: true
    stdin_open: true
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_PEER_TLS_ENABLED=true
    working_dir: /work
    command: sleep infinity
    volumes:
      - .:/work
    networks: [antidoping_v2]

  ca-tools:
    image: hyperledger/fabric-ca:1.5.15
    container_name: ca-tools
    tty: true
    stdin_open: true
    working_dir: /work
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    volumes:
      - .:/work
    networks: [antidoping_v2]

  # ---------------------------------------------------------- Chaincode as a service
  # CHAINCODE_ID values are written into .env by scripts/deploy-chaincode.sh.
  # One container serves every chaincode definition that uses its package.
  custody-cc:
    build: ./chaincode/custody
    image: antidoping/custody-cc:2.0
    container_name: custody-cc
    cpuset: "0-5"
    labels: { antidoping.role: "chaincode" }
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=${CUSTODY_CCID}
      - CORE_CHAINCODE_ID_NAME=${CUSTODY_CCID}
      - CLOCK_SKEW_SECONDS=300
    networks: [antidoping_v2]

  consent-cc:
    build: ./chaincode/consent
    image: antidoping/consent-cc:2.0
    container_name: consent-cc
    cpuset: "0-5"
    labels: { antidoping.role: "chaincode" }
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=${CONSENT_CCID}
      - CORE_CHAINCODE_ID_NAME=${CONSENT_CCID}
      - CLOCK_SKEW_SECONDS=300
    networks: [antidoping_v2]

  # ---------------------------------------------------------- Application tier
  gateway:
    build: ./gateway
    image: antidoping/gateway:2.0
    container_name: gateway
    cpuset: "0-5"
    labels: { antidoping.role: "gateway" }
    environment:
      - PORT=3000
      - CHANNEL=antidopingchannel
      - CRYPTO_ROOT=/work/network/organizations
    ports:
      - "3000:3000"
    volumes:
      - ./network/organizations:/work/network/organizations:ro
    networks: [antidoping_v2]

  web:
    build: ./web
    image: antidoping/web:2.0
    container_name: web
    labels: { antidoping.role: "web" }
    ports:
      - "8088:80"
    networks: [antidoping_v2]
